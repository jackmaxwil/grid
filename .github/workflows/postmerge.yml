# The deep rungs of har-verify's ladder: too slow to block a PR, run after the merge.
# Adapted from yi's .forgejo/workflows/postmerge.yml, whose away game is the profile that
# ships. Grid's away game is the tooling that can see through its one unsafe block and the
# loop counts a PR gate cannot afford — every job here is evidence a claim row names.
name: postmerge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # C1: no input to chart-io causes UB. MIRI cannot execute mmap, so it interprets the
  # byte-interpretation crate — which is where an adversarial image would actually cause
  # UB — and ASan runs the real mapping against the real allocator. The adversarial suite
  # is the whole attack surface in one binary; proptest under MIRI is minutes of
  # interpreter for the same coverage.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just miri
      - run: cargo +nightly test -p grid-chart-io --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address

  # C3: every walk terminates within fuel. A proof, not a sample, so it runs where minutes
  # are affordable.
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,kani-verifier
      - run: cargo kani setup
      - run: just verify

  # C11: a store reopens valid after kill -9 at any instant. That is a claim about a race,
  # so it is evidenced by running the race many times, never by argument. PR time runs a
  # short loop inside the test lane; this is the soak.
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just soak

  # The fuzz targets PR time only compiles. Short runs, because a corpus this job does not
  # keep makes every run a first run; the value here is that the entry points are exercised
  # on real bytes at all.
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [normalize, references, segment]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300
