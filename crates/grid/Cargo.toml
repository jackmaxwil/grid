[package]
name = "grid"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
grid-chart = { path = "../chart", version = "0.1.0" }
grid-chart-io = { path = "../chart-io", version = "0.1.0" }
grid-survey = { path = "../survey", version = "0.1.0" }
grid-cache = { path = "../cache", version = "0.1.0" }
grid-datum = { path = "../datum", version = "0.1.0" }
grid-leadline = { path = "../leadline", version = "0.1.0" }
grid-wake = { path = "../wake", version = "0.1.0" }
grid-wire = { path = "../wire", version = "0.1.0" }
grid-xte = { path = "../xte", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
grid-chart = { path = "../chart", version = "0.1.0" }
grid-chart-io = { path = "../chart-io", version = "0.1.0" }
tempfile = "3"
