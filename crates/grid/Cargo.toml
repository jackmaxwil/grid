[package]
name = "grid"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
grid-chart = { path = "../chart", version = "0.1.0" }
grid-chart-io = { path = "../chart-io", version = "0.1.0" }
grid-survey = { path = "../survey", version = "0.1.0" }
# The cfg evaluator lives beside the cfg extractor: one crate owns what a
# predicate means, and it is the one that already depends on syn.
grid-lang-rs = { path = "../lang-rs", version = "0.1.0" }
grid-cache = { path = "../cache", version = "0.1.0" }
grid-walk = { path = "../walk", version = "0.1.0" }
grid-trace = { path = "../trace", version = "0.1.0" }
grid-wire = { path = "../wire", version = "0.1.0" }
grid-gate = { path = "../gate", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
serde_json = "1"
# The socket tests speak to the daemon the way a consumer does. A
# dev-dependency is invisible to check_boundaries.py, so boundaries.toml
# records this edge in a comment beside grid-client's own entry.
grid-client = { path = "../client", version = "0.1.0" }
grid-chart = { path = "../chart", version = "0.1.0" }
grid-chart-io = { path = "../chart-io", version = "0.1.0" }
grid-trace = { path = "../trace", version = "0.1.0" }
tempfile = "3"
