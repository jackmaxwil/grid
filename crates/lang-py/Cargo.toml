[package]
name = "grid-lang-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
grid-datum = { path = "../datum", version = "0.1.0" }
# Default features pull malachite (LGPL-3.0-only) for bigint literals; the
# num-bigint path is MIT/Apache and does the same job. `location` is off: grid
# addresses code by structure, never by line number. `full-lexer` keeps comment
# tokens, which are retained as metadata rather than hashed.
rustpython-parser = { version = "0.4", default-features = false, features = ["num-bigint", "full-lexer"] }
rustpython-ast = { version = "0.4", default-features = false, features = ["num-bigint", "fold", "visitor"] }

[dev-dependencies]
proptest = "1"

# Named nowhere in this crate's source: the AST types are reached through
# `rustpython_parser::ast`, and this entry exists to turn on the `fold` and
# `visitor` features the extractor's Fold and Visitor impls need.
[package.metadata.cargo-machete]
ignored = ["rustpython-ast"]
