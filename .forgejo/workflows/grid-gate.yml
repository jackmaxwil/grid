name: grid-gate

# Grid lives in its own repo (apex/grid); this workflow is the whole gate.
# packages/grid/** in the monorepo is gitignored, so buildhost's workspace-gate
# never sees grid content — a grid PR runs exactly this workflow.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
        # Determinism smoke (plan Wave 2 accept): hashing a real tree twice
        # must agree. The repo itself is the corpus grid always has.
        env:
          GRID_CORPUS: ${{ github.workspace }}
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo fmt --check

  # Fuzz targets are code: they must keep compiling even when nothing fuzzes
  # them in PR time. A rotting target is a claim with no evidence behind it.
  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build normalize
      - run: cargo fuzz build segment

  # C1 evidence: the one unsafe block in grid, under the tools that can see
  # through it. MIRI interprets everything except the mmap itself; ASan runs
  # the real mapping against the real allocator.
  chart-io-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      # MIRI cannot execute mmap, so it runs the byte-interpretation crate —
      # which is where an adversarial image would actually cause UB.
      # The adversarial suite is the whole attack surface in one binary;
      # proptest under MIRI is minutes of interpreter for the same coverage.
      - run: cargo +nightly miri test -p grid-chart --test adversarial
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
      - run: cargo +nightly test -p grid-chart-io --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address

  # Crash safety is a claim about a race, so it is evidenced by running the
  # race many times, not by argument. PR time runs a short loop (in the normal
  # test job); this is the soak.
  fault-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p grid-chart-io --release --test crash_safety -- --nocapture
        env:
          GRID_FAULT_ITERS: "10000"

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # C5 evidence: no unsafe outside chart-io, and chart-io is the only crate
  # permitted to ever contain it.
  assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C5 grep-gate — unsafe is confined to chart-io
        run: ./scripts/check-unsafe-confined.sh
      - name: ASSURANCE.md claims all have evidence links
        run: ./scripts/check-assurance-links.sh
