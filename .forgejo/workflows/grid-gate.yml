name: grid-gate

# Grid lives in its own repo (apex/grid); this workflow is the whole gate.
# packages/grid/** in the monorepo is gitignored, so beelink's workspace-gate
# never sees grid content — a grid PR runs exactly this workflow.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
        # Determinism smoke (plan Wave 2 accept): hashing a real tree twice
        # must agree. The repo itself is the corpus grid always has.
        env:
          GRID_CORPUS: ${{ github.workspace }}
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo fmt --check

  # Fuzz targets are code: they must keep compiling even when nothing fuzzes
  # them in PR time. A rotting target is a claim with no evidence behind it.
  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build normalize

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # C5 evidence: no unsafe outside chart-io, and chart-io is the only crate
  # permitted to ever contain it.
  assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C5 grep-gate — unsafe is confined to chart-io
        run: |
          if grep -rn '\bunsafe\b' crates --include='*.rs' | grep -v '^crates/chart-io/'; then
            echo "unsafe code outside chart-io"; exit 1
          fi
      - name: ASSURANCE.md claims all have evidence links
        run: ./scripts/check-assurance-links.sh

  # From wave 3 on, grid gates its own PRs: the plan's ground rule, and the
  # best corpus we own. The track is hand-written in .grid/tracks and names
  # what this branch promised to change; exit 3 means the diff diverged from
  # it. Self-hosting is a bootstrap hazard by design — the beelink gate keeps
  # its human override producer for the case where a grid bug blocks a grid
  # fix.
  self-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
      - uses: Swatinem/rust-cache@v2
      - name: grid gates grid
        run: |
          track=$(ls .grid/tracks/*.json 2>/dev/null | head -1)
          [ -n "$track" ] || { echo "no track: a grid PR carries one"; exit 1; }
          cargo run -q -p grid -- gate "$track" HEAD
