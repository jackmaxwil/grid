[package]
name = "grid-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "Proprietary"

[package.metadata]
cargo-fuzz = true

# Own workspace: cargo-fuzz builds with nightly and its own lock.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
grid-chart = { path = "../crates/chart" }
grid-lang-py = { path = "../crates/lang-py" }
grid-client = { path = "../crates/client" }

[[bin]]
name = "normalize"
path = "fuzz_targets/normalize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "references"
path = "fuzz_targets/references.rs"
test = false
doc = false
bench = false

[[bin]]
name = "segment"
path = "fuzz_targets/segment.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_response"
path = "fuzz_targets/client_response.rs"
test = false
doc = false
bench = false
