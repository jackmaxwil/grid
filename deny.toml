# cargo-deny configuration. Every dependency entry gets a justification line
# in docs/ASSURANCE.md — a dep is TCB and must earn its place.

# Dev-deps never ship, and the targets are the ones grid builds for: this is
# the graph the assurance case is about, not everything cargo can resolve.
[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
exclude-dev = true

[advisories]
db-path = "~/.cargo/advisory-db"
yanked = "deny"
# The rust-unic family is unmaintained with no safe upgrade; it reaches us
# through rustpython-parser's Unicode tables. Parse-time tables, not
# network-facing code; the parser itself is justified in ASSURANCE.md.
# Tracked; revisited when the parser migrates off rust-unic.
ignore = [
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0090", # unic-emoji-char
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
]

[licenses]
# `exclude-dev = true` narrows the graph past some workspace members, so three allowed
# licences — BSD-2-Clause, Zlib and grid's own LicenseRef-Proprietary — are never
# encountered and each printed a `license-not-encountered` warning on every gate run. The
# allowlist is the policy, not a census of what today's lockfile happens to contain, so the
# warning class goes rather than the entries.
unused-allowed-license = "allow"
# CC0-1.0 is a public-domain dedication: no conditions on use, permissive in
# the only sense that matters here (tiny-keccak, parser build-time dep).
# LicenseRef-Proprietary is the workspace's own crates: proprietary is a
# license, not an absence of one.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "CC0-1.0", "ISC", "Unicode-3.0", "Zlib", "Unicode-DFS-2016", "LicenseRef-Proprietary"]

[bans]
wildcards = "deny"
multiple-versions = "deny"
# syn 2 + syn 3 are proc-macro build deps of the two parsers; zero runtime
# bytes reach the binary, and grid does not get to pick either version.
skip = [{ crate = "syn" }]
# ASSURANCE.md's standing rule — no new runtime dependency — in the one form
# CI can check. Each name is something a code-charting tool is tempted by and
# refuses: argument parsing, error erasure, matching, walking, watching, git,
# threading, and networking are all grid's own code or std's.
deny = [
    "clap",
    # Grid's errors are typed enums at every crate boundary. The parser's own
    # build script erases its errors; those bytes never reach the binary.
    { crate = "anyhow", wrappers = ["rustpython-parser"] },
    "regex",
    "walkdir",
    "notify",
    "git2",
    "libgit2-sys",
    "gix",
    "rayon",
    "tokio",
    "reqwest",
    "hyper",
    "openssl-sys",
    "native-tls",
    "lazy_static",
    # std's OnceLock is the answer for grid's own code; the parser's vendored
    # Unicode tables predate it and grid does not get to rewrite them.
    { crate = "once_cell", wrappers = ["rustpython-parser-vendored"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
