# cargo-deny configuration. Every dependency entry gets a justification line
# in docs/ASSURANCE.md — a dep is TCB and must earn its place.
[advisories]
db-path = "~/.cargo/advisory-db"
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]

[bans]
wildcards = "deny"
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
